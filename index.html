<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Rest of the Story Consignment Dashboard</title>
    <!-- No page analytics here on purpose: this is an internal tool, and the
         Simple Analytics snippet was reporting dashboard visits under the
         client's own hostname, inflating the numbers this dashboard reports. -->
    <script>
      // Set the theme before first paint so the app doesn't flash light.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
